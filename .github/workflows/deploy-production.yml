name: Build and deploy backend

# 构建并推送后端镜像；配置了 SSH secrets 时顺带部署。前端不参与这条链路。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io
  # 后端解决方案与 Docker 构建上下文都在这一个目录下。
  BACKEND_DIR: backend/Downloader.WebApi
  # 国内镜像仓库：这两个 Variable 都配了才会双推，没配就只推 ghcr。
  # 配在 仓库/组织 → Settings → Secrets and variables → Actions → Variables。
  # 本项目用腾讯云 TCR 个人版，所以 MIRROR_REGISTRY=ccr.ccs.tencentyun.com；
  # MIRROR_NAMESPACE 填 TCR 控制台里建的命名空间，仓库名沿用 $GITHUB_REPOSITORY 的末段。
  # 配套的 MIRROR_USERNAME / MIRROR_PASSWORD 两个 Secret：用户名是腾讯云账号 ID，
  # 密码是 TCR 实例管理里「初始化密码」设的固定密码。
  MIRROR_REGISTRY: ${{ vars.MIRROR_REGISTRY }}
  MIRROR_NAMESPACE: ${{ vars.MIRROR_NAMESPACE }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore "$BACKEND_DIR/Downloader.WebApi.slnx"
      - name: Build
        run: dotnet build "$BACKEND_DIR/Downloader.WebApi.slnx" --no-restore --configuration Release
      - name: Test
        run: dotnet test "$BACKEND_DIR/Downloader.WebApi.slnx" --no-build --configuration Release --verbosity normal

  publish:
    name: Build image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # job 默认超时是 360 分钟：卡住时不会失败，只会静默占着 runner；又因为下面的
    # concurrency group 是 cancel-in-progress: false，后续每次 push 都会排在这个
    # 卡死的 run 后面。90 分钟 = 冷缓存构建 + 两段推送，留了余量。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image name and tags
        id: image
        shell: bash
        run: |
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="${REGISTRY}/${repository}"
          name="${repository##*/}"

          # tag 分两组输出，因为下面两条 push 是分开的两步（原因见那两步的注释）：
          # ghcr 永远推；配了国内镜像仓库时，同一批 tag 再推一份过去，
          # 好让国内服务器从那边拉，绕开 ghcr 的跨国链路。
          {
            echo "ghcr_tags<<TAGS_EOF"
            echo "${image}:${GITHUB_SHA}"
            echo "${image}:latest"
            echo "TAGS_EOF"
            if [[ -n "$MIRROR_REGISTRY" && -n "$MIRROR_NAMESPACE" ]]; then
              echo "mirror_tags<<TAGS_EOF"
              echo "${MIRROR_REGISTRY}/${MIRROR_NAMESPACE}/${name}:${GITHUB_SHA}"
              echo "${MIRROR_REGISTRY}/${MIRROR_NAMESPACE}/${name}:latest"
              echo "TAGS_EOF"
            fi
          } >> "$GITHUB_OUTPUT"

          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 国内镜像仓库：上面两个 Variable 都配了才会登录并多推一份。
      - name: Sign in to mirror registry
        if: env.MIRROR_REGISTRY != '' && env.MIRROR_NAMESPACE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.MIRROR_REGISTRY }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}
      # 构建+推送拆成两步，而不是一个 tags 列表一次推两个仓库：buildx 的一个 export
      # 顶点会并发推所有目标仓库，但只要其中一个没返回，整步就停在日志末行
      # "exporting to image" 上不动 —— 既看不出是哪个仓库慢，也没法单独重试。
      # 拆开后 ghcr 先落地（快），国内镜像单独一步、单独超时。
      - name: Build and push to GitHub Container Registry
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          file: ${{ env.BACKEND_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.ghcr_tags }}
          # 关掉 buildx 默认生成的 provenance 证明：那是额外的 manifest + blob，两个
          # 仓库各要推一份，而它走的正是 buildkit 那套 cache/descriptor 导出路径
          # （moby/buildkit#6131 卡死的路径）。本服务不消费证明，直接关掉。
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
        # 冷缓存首次构建约 10 分钟。这里只是防它像 job 默认的 360 分钟那样挂着不动。
        timeout-minutes: 25

      # 第二遍构建的每个 RUN/COPY 都会命中上一步留在同一个 builder 容器里的本地缓存，
      # 秒级完成；这一步真正的时间全花在把层推到 ccr.ccs.tencentyun.com 这段从 Azure
      # 到国内的链路上（首次全量推送实测约 40 分钟）。40 分钟是"卡住就别再等"的上限，
      # 基底层已经在 TCR 里时每次只推改动的应用层，远用不到。
      - name: Push to mirror registry
        if: env.MIRROR_REGISTRY != '' && env.MIRROR_NAMESPACE != ''
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.BACKEND_DIR }}
          file: ${{ env.BACKEND_DIR }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.mirror_tags }}
          provenance: false
          # 本地缓存没命中时的兜底；正常情况用不上。
          cache-from: type=gha
        timeout-minutes: 40

  deploy:
    name: Deploy over SSH
    needs: [publish]
    if: >-
      needs.publish.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      packages: read
    concurrency:
      group: downloader-production-deploy
      cancel-in-progress: false
    steps:
      # scp-action 从工作区打包文件，部署 job 必须先 checkout。
      - uses: actions/checkout@v4
      # 与 LuckyVerify 一致：SSH 配置齐全才部署，缺失时只推送镜像并给出提示。
      # secrets 不能在 job 级 if 中使用，所以在步骤内探测；job 声明 environment 才能读到环境级 secrets。
      - name: Detect SSH deployment secrets
        id: detect
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$SSH_HOST" && -n "$SSH_USER" && -n "$SSH_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=跳过自动部署::未配置 SSH_HOST / SSH_USER / SSH_PRIVATE_KEY；镜像已推送，可继续手动执行 deploy/build_from_ghcr.sh。"
          fi
      # 配了国内镜像仓库就优先从那边拉（ghcr 在国内基本拉不动）。
      - name: Resolve deployment image
        id: image
        shell: bash
        run: |
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          name="${repository##*/}"
          if [[ -n "$MIRROR_REGISTRY" && -n "$MIRROR_NAMESPACE" ]]; then
            echo "ref=${MIRROR_REGISTRY}/${MIRROR_NAMESPACE}/${name}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "mirror=true" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${REGISTRY}/${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "mirror=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create deployment directory
        if: steps.detect.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          script: mkdir -p /opt/downloader/deploy
      # 只同步 deploy/ 目录；含密钥的 .env 由运维在服务器上维护，绝不经过工作流。
      - name: Upload deployment definitions
        if: steps.detect.outputs.enabled == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: deploy
          target: /opt/downloader/deploy
          strip_components: 1
      - name: Pull and restart
        if: steps.detect.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          USE_MIRROR: ${{ steps.image.outputs.mirror }}
          MIRROR_USER: ${{ secrets.MIRROR_USERNAME }}
          MIRROR_PASSWORD: ${{ secrets.MIRROR_PASSWORD }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_DIR: /opt/downloader/deploy
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: IMAGE,USE_MIRROR,MIRROR_USER,MIRROR_PASSWORD,REGISTRY_USER,REGISTRY_TOKEN,DEPLOY_DIR
          command_timeout: 20m
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            if [ "$USE_MIRROR" = "true" ]; then
              PULL_USERNAME="${MIRROR_USER:-}"
              PULL_TOKEN="${MIRROR_PASSWORD:-}"
            else
              PULL_USERNAME="$REGISTRY_USER"
              PULL_TOKEN="$REGISTRY_TOKEN"
            fi
            # build_from_ghcr.sh 在 PULL_TOKEN 存在时临时登录对应仓库，退出时自动登出。
            export IMAGE PULL_USERNAME PULL_TOKEN
            bash ./build_from_ghcr.sh
