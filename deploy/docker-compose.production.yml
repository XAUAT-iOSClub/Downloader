services:
  app:
    image: ${IMAGE:?IMAGE must be set to an immutable image tag}
    container_name: downloader
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 显式固定生产环境：appsettings 里没有业务配置，运行时全部来自 .env / 环境变量。
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      # 同机 XAUAT.EduApi 默认占 8080，这里默认 8081；用 APP_PORT 覆盖。
      - "${APP_PORT:-8081}:8080"
